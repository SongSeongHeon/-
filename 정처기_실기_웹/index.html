<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정처기 실기 기출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E8ECF1;
  --paper:#FFFFFF;
  --ink:#1D2B45;
  --muted:#5A6A82;
  --line:#CBD3DE;
  --soft:#F2F5F9;
  --red:#D5283C;
  --red-soft:#FBE9EC;
  --ok-soft:#E6ECF8;
  --code-bg:#17233A;
  --code-ink:#E8EEF7;
  --sans:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Nanum Gothic",system-ui,sans-serif;
  --serif:var(--sans);
  --mono:"D2Coding","JetBrains Mono","SF Mono",Consolas,"Malgun Gothic","맑은 고딕","Courier New",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.6 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#app{
  max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
}
@media (max-width:760px){#app{border-left:0;border-right:0}}

/* ---------- 공통 버튼 ---------- */
.btn{min-height:48px;padding:0 20px;border-radius:6px;border:1px solid var(--ink);background:var(--paper);font-weight:700;font-size:16px;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:13.5px}

/* ---------- 홈 ---------- */
.home-head{padding:30px 20px 10px}
.home-head h1{font:700 28px/1.3 var(--sans);margin:0 0 8px;letter-spacing:-0.02em}
.home-head p{margin:0;color:var(--muted);font-size:14.5px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px;margin-top:14px;overflow-x:auto}
.tab{background:none;border:0;padding:12px 10px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.panel{padding:20px 20px 24px;flex:1}
.group{margin:0 0 24px}
.group h2{font-size:14px;font-weight:700;margin:0 0 10px}
.group .note{margin:0 0 12px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:15px}
.chip small{color:var(--muted);margin-left:6px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:#C5D0E2}
.year-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px}
.year-row .y{width:50px;flex:none;padding-top:8px;font:700 15px var(--sans)}
.setlinks{display:flex;gap:16px;margin-top:4px}
.startbar{
  position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);
}
.startbar .count{font-size:15px}
.startbar .count b{font:700 20px var(--sans)}
.foot{padding:16px 20px 28px;color:var(--muted);font-size:12.5px;line-height:1.7;border-top:1px solid var(--line)}
.foot p{margin:0 0 8px}
.foot .links{display:flex;gap:18px}

/* 복습 목록 */
.rlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rlist li{border-bottom:1px solid var(--line)}
.ritem{display:flex;align-items:center;gap:10px;width:100%;padding:12px 2px;background:none;border:0;text-align:left;font-size:15px}
.ritem .rt{flex:1;min-width:0}
.ritem .ra{font-size:12.5px;color:var(--muted)}
.rtag{font-size:12px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);color:var(--muted)}
.rtag.red{border-color:var(--red);color:var(--red)}

/* ---------- 문제 풀이 ---------- */
.topbar{position:sticky;top:0;z-index:3;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.topbar .quit{background:none;border:0;padding:10px 10px;font-size:15px;color:var(--muted)}
.topbar .pos{font-size:15px;font-weight:500}
.flagbtn{display:flex;align-items:center;gap:6px;background:none;border:0;padding:10px 10px;font-size:15px;color:var(--muted)}
.flagbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.flagbtn[aria-pressed="true"]{color:var(--ink);font-weight:700}
.flagbtn[aria-pressed="true"] svg{fill:var(--ink)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--ink)}
.sheet{padding:20px 20px 32px;flex:1}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);margin-bottom:12px}
.numrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.num{position:relative;font:700 46px/1 var(--sans);min-width:64px;padding:8px 12px 8px 8px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted)}
.tag.red{border-color:var(--red);color:var(--red)}
.stem{font:500 17px/1.75 var(--sans);white-space:pre-wrap;margin:0 0 14px;word-break:keep-all;overflow-wrap:anywhere}
.extra{font:400 16px/1.75 var(--sans);white-space:pre-wrap;margin:0 0 14px;padding-left:12px;border-left:2px solid var(--line);word-break:keep-all;overflow-wrap:anywhere}
pre.code{margin:0 0 14px;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:4px;overflow-x:auto;font:14px/1.65 var(--mono);tab-size:4;-webkit-overflow-scrolling:touch}
figure.fig{margin:0 0 14px}
figure.fig img{max-width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.fig-missing{border:1px dashed var(--red);color:var(--red);padding:18px 14px;font-size:14px;margin:0 0 14px;word-break:break-all}

/* 정답 입력 */
.inputs{margin:20px 0 4px;padding-top:16px;border-top:1px solid var(--line)}
.inputs .ttl{font-size:14px;font-weight:700;margin:0 0 10px}
.in-row{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.in-label{flex:none;min-width:30px;font-weight:700;color:var(--muted);font-size:15px}
.in-row input,.in-row textarea{flex:1;min-width:0;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:6px;font:16px/1.5 var(--sans);background:#fff;color:var(--ink)}
.in-row textarea{resize:vertical;font-family:var(--mono);font-size:15px}
.in-row input:focus,.in-row textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--ok-soft)}
.pickhint{font-size:14px;color:var(--muted);margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;text-align:left;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;font-size:15px;line-height:1.35}
.opt b{font-weight:700}
.opt span{color:var(--muted);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.opt[aria-pressed="true"] span{color:#C5D0E2}
.opt .ord{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;padding:0 5px}
.eachrow{margin:0 0 16px}
.eachrow .in-label{display:block;margin:0 0 6px;min-width:0}
.skiprow{margin-top:6px}
.msg{margin:10px 0 0;color:var(--red);font-size:14px}

/* 채점 결과 */
.answer{margin-top:22px;border-top:2px solid var(--ink);padding-top:14px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:6px;font-weight:700;font-size:17px;margin:0 0 14px}
.banner.ok{background:var(--ok-soft)}
.banner.no{background:var(--red-soft);color:var(--red)}
.banner svg{width:24px;height:24px;fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;flex:none}
.mine{margin:0 0 16px;font-size:15px}
.mine h3{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
.mine .mrow{display:flex;gap:8px;align-items:baseline;padding:2px 0;word-break:break-all}
.mine .mlab{flex:none;color:var(--muted);min-width:30px}
.mine .ok{color:var(--ink)}
.mine .no{color:var(--red);text-decoration:line-through}
.mine .empty{color:var(--muted)}
.answer h3.ah{margin:0 0 6px;font-size:13.5px;color:var(--red)}
.ans-line{font:700 17px/1.8 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere}
.ans-note{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.explain{margin-top:18px;padding:14px;background:var(--soft);border-radius:6px}
.explain h3{margin:0 0 8px;font-size:13.5px}
.explain .body{white-space:pre-wrap;line-height:1.75;font-size:15px;overflow-wrap:anywhere;word-break:keep-all}
.explain code{font:13.5px var(--mono);background:#fff;border:1px solid var(--line);padding:0 5px;border-radius:3px;word-break:break-all}
.grade-label{margin:18px 0 8px;font-size:13.5px;color:var(--muted)}
.grade{display:flex;gap:10px}
.grade button{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--red);background:var(--paper);color:var(--red);border-radius:6px;font-weight:700;font-size:15.5px}
.grade button[aria-pressed="true"]{background:var(--red-soft)}
.grade svg{width:22px;height:22px;fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round}
.bottombar{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
.bottombar .primary{flex:1}
.bottombar .btn{padding:0 16px}

/* 빨간펜 채점 표시 */
.mark{position:absolute;left:-6px;top:-8px;width:88px;height:88px;overflow:visible;pointer-events:none}
.mark *{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round}
.mark.anim *{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.mark.anim *{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}

/* ---------- 결과 ---------- */
.result{padding:34px 20px 28px;flex:1}
.score{font:700 64px/1 var(--sans)}
.score small{font-size:26px;font-weight:400;color:var(--muted)}
.result p{margin:10px 0 0;color:var(--muted)}
.result h2{font-size:14px;margin:30px 0 8px}
.wrong-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.wrong-list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.wrong-list span{color:var(--muted);font-size:13.5px}
.result-actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}

/* ---------- 이미지 점검 ---------- */
.check{padding:20px;flex:1}
.check h1{font:700 24px/1.3 var(--sans);margin:0 0 6px}
.check .sum{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.check table{width:100%;border-collapse:collapse;font-size:14px}
.check th,.check td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.check th{font-weight:700;border-bottom:2px solid var(--ink)}
.check code{font:13px var(--mono);word-break:break-all}
.st-ok{font-weight:700}
.st-no{color:var(--red);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<noscript>이 페이지는 자바스크립트가 켜져 있어야 동작해요.</noscript>

<script>
/* =====================================================================
   데이터
   - 회차를 추가할 때는 ROUNDS.push({...}) 블록을 하나 더 만들면 돼요.
   - area : C / Java / Python / SQL / 데이터베이스 / 소프트웨어 공학 / 테스트 / 네트워크 / 보안 / 운영체제 / 알고리즘 / 기타
   - type : code(코드 해석) / concept(개념) / fill(빈칸 채우기) / calc(계산)
   - img  : 문제에 들어가는 이미지 개수.  파일명 규칙  img/2026-1-03.png  (여러 장이면 -1, -2)
   - aimg : 정답에 들어가는 이미지 개수.  파일명 규칙  img/2026-1-03-a.png (여러 장이면 -a1, -a2)
   - after        : 이미지/코드 뒤에 이어서 보여줄 문제 텍스트 (보기 목록 등)
   - imgAfterCode : true 이면 코드 다음에 이미지를 배치 (기본은 이미지 다음에 코드)
   - note         : 정답 아래에 붙는 메모
   - 해설은 EXPL["연도-회차-번호"], 채점 방식 예외는 SPEC["연도-회차-번호"] 에 있어요.
   ===================================================================== */
const ROUNDS = [];
/* ===== 2026년 1회 ===== */
ROUNDS.push({year:2026, round:1, src:"https://chobopark.tistory.com/561", questions:[
{n:1, area:"C", type:"code",
 stem:"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.",
 code:`#include <stdio.h>

double arr1(int p[], int len) {
    double av = 0;
    int i;
    for (i = 0; i < len; i++) {
        av += (double) p[i];
    }
    return av / len;
}

double arr2(int * p, int len) {
    double av = 0;
    int i;
    for (i = 0; i < len; i++) {
        av += (double)( * (p + i));
    }
    return av / len;
}

int main() {
    int arr[10] = {
        80,
        20,
        50,
        55,
        45,
        95,
        55,
        10,
        40,
        80
    };
    int len = 10;

    printf("%.2f", arr1(arr, len) + arr2(arr, len));

    return 0;
}`,
 ans:["106.00"]},

{n:2, area:"소프트웨어 공학", type:"concept",
 stem:"다음 설명에 해당하는 디자인 패턴의 유형을 괄호( ) 안에 쓰시오.",
 extra:`• ( ㄱ ) 패턴은 기능의 클래스 계층과 구현의 클래스 계층을 연결
• ( ㄴ ) 패턴은 한 객체의 상태가 바뀌면 그 객체에 의존`,
 ans:["ㄱ. Bridge","ㄴ. Observer"]},

{n:3, area:"데이터베이스", type:"concept", img:1,
 stem:"데이터베이스(DB) 설계 절차를 순서대로 나타낸 것이다. 각 빈칸에 들어갈 알맞은 용어를 쓰시오.",
 ans:["ㄱ. 요구사항 분석","ㄴ. 개념적 설계","ㄷ. 논리적 설계","ㄹ. 물리적 설계","ㅁ. 구현"]},

{n:4, area:"소프트웨어 공학", type:"concept",
 stem:"다음은 비기능적 요구사항에 대한 설명이다. 각 항목이 의미하는 요구사항 유형을 보기에서 골라 쓰시오.",
 extra:`1. 시스템 운영 중 로그 관리 및 모니터링 기능을 제공해야 한다.
2. 시스템 운영 시 최소 메모리 용량을 확보해야 하며, 자원 사용량은 제한 범위 내에 있어야 한다.
3. 사용자 요청에 대한 응답 시간은 최대 1분을 초과하지 않아야 한다.

[보기]
신뢰성, 가용성, 운영, 유지보수성, 자원, 성능, 이식성, 보안, 품질`,
 ans:["1. 운영","2. 자원","3. 성능"]},

{n:5, area:"보안", type:"concept",
 stem:"다음 용어의 영문 약자를 쓰시오.",
 extra:"정보보호 관리체계",
 ans:["ISMS"]},

{n:6, area:"네트워크", type:"concept",
 stem:"HDLC는 비트 중심의 데이터 링크 제어 프로토콜로, 프레임 단위로 데이터를 전송하며 흐름 제어 및 오류 복구 기능을 제공한다. 다음 설명을 읽고 알맞은 용어를 쓰시오.",
 extra:`[HDLC 구성 요소]
1. HDLC 프레임의 구성 단위로, 실제 사용자 데이터를 전송하는 프레임
2. 데이터 링크의 흐름을 관리하고 오류 제어 및 통신 상태를 감시하는 프레임
3. 순서 번호 없이 링크 설정, 해제, 모드 설정 등 제어 기능을 수행하는 프레임
4. 두 국(Station)이 동등한 위치에서 서로 명령과 응답을 주고받는 모드
5. 종국(Secondary)이 주국(Primary)의 허가 없이도 자발적으로 응답을 전송할 수 있는 모드`,
 ans:["1. 정보","2. 감독","3. 비번호","4. 비동기 균형 모드","5. 비동기 응답 모드"]},

{n:7, area:"Java", type:"code",
 stem:"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.",
 code:`class A {
    String f(Object x) {
        return "1";
    }

    String g() {
        return f("a");
    }
}

class B extends A {
    String f(Object x) {
        return "2";
    }

    String f(String x) {
        return "3";
    }
}

public class Main {
    public static void main(String[] args) {
        A a = new B();

        System.out.println(a.g());
    }
}`,
 ans:["2"]},

{n:8, area:"Python", type:"code",
 stem:"아래 파이썬 코드가 있다. 입력값으로 HumanDev를 주었을 때 출력되는 결과를 쓰시오.",
 code:`i = input()
x = []

for word in i.split():
    x.append(word)

y = ''.join(x)
z = ''.join(c for c in y[::-1] if c not in 'ong')

print(z)`,
 ans:["veDamuH"]},

{n:9, area:"SQL", type:"code",
 stem:"아래 조건을 참고하여 각 SQL 구문을 실행했을 때 반환되는 행(Row)의 수를 쓰시오.\n(단, DEPT 칼럼은 학과명이다.)",
 extra:`[테이블 조건]
STUDENT 테이블에는 다음 세 학과의 학생 정보가 저장되어 있다.
컴퓨터과 50명 · 인터넷과 100명 · 사무자동화과 50명`,

    return 0;

    return 0;

    else isWhat[++point] = num;

        int a[] = {1, 2, 3, 4, 5, 6, 7, 8, 9};
        ODDNumber OE = new ODDNumber();
        System.out.print(OE.sum(a, true) + ", " + OE.sum(a, false));

interface Number {
    int sum(int[] a, boolean odd);
}

class ODDNumber implements Number {
    public int sum(int[] a, boolean odd) {
        int result = 0;
        for(int i=0; i < a.length; i++){
            if((odd && a[i] % 2 != 0) || (!odd && a[i] % 2 == 0))
                result += a[i];
        }
        return result;
    }
}`,

{n:11, area:"C", type:"code",

 code:`#include <stdio.h>
#include <stdlib.h>

void set(int** arr, int* data, int rows, int cols) {
    for (int i = 0; i < rows * cols; ++i) {
        arr[((i + 1) / rows) % rows][(i + 1) % cols] = data[i];
    }
}

int main() {
    int rows = 3, cols = 3, sum = 0;
    int data[] = {5, 2, 7, 4, 1, 8, 3, 6, 9};
    int** arr;
    arr = (int**) malloc(sizeof(int*) * rows);

    for (int i = 0; i < cols; i++) {
        arr[i] = (int*) malloc(sizeof(int) * cols);
    }

    set(arr, data, rows, cols);

    for (int i = 0; i < rows * cols; i++) {
        sum += arr[i / rows][i % cols] * (i % 2 == 0 ? 1 : -1);
    }

    for(int i=0; i<rows; i++) {
        free(arr[i]);
    }

    free(arr);

    printf("%d", sum);
}`,

 code:`#include <stdio.h>
#include <stdlib.h>

typedef struct Data {
    int value;
    struct Data *next;
} Data;

Data* insert(Data* head, int value) {
    Data* new_node = (Data*)malloc(sizeof(Data));
    new_node->value = value;
    new_node->next = head;

    return new_node;
}

Data* reconnect(Data* head, int value) {
    if (head == NULL || head->value == value) return head;
    Data *prev = NULL, *curr = head;

    while (curr != NULL && curr->value != value) {
        prev = curr;
        curr = curr->next;
    }

    if (curr != NULL && prev != NULL) {
        prev->next = curr->next;
        curr->next = head;
        head = curr;
    }

    return head;
}

int main() {

    Data *head = NULL, *curr;

    for (int i = 1; i <= 5; i++)
        head = insert(head, i);
    head = reconnect(head, 3);

    for (curr = head; curr != NULL; curr = curr->next)
        printf("%d", curr->value);

    return 0;
}`,

const CIRC = /[①-⑳]/g;
function normStr(s, q, f){
  s = String(s == null ? "" : s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u00A0/g," ");
  if(f && f.digits){
    s = s.replace(CIRC, c => String(c.charCodeAt(0) - 0x2460 + 1));
    return s.replace(/\D/g,"");
  }
  if(q.type === "code" || q.type === "calc") return s.replace(/\s+/g,"").replace(/ms$/i,"");
  if(q.type === "fill") return s.replace(/\s+/g,"").toLowerCase().replace(/;+$/,"");
  return s.toLowerCase().replace(/[\s.,;:'"()\[\]{}<>·\-_]/g,"");
}
function ipToInt(ip){
  const p = String(ip).trim().split(".");
  if(p.length !== 4) return null;
  let n = 0;
  for(const x of p){ if(!/^\d{1,3}$/.test(x) || +x > 255) return null; n = n*256 + (+x); }
  return n;
}
function inCidr(ip, cidr){
  const parts = cidr.split("/"), len = +parts[1];
  const base = ipToInt(parts[0]), v = ipToInt(ip);
  if(base == null || v == null) return false;
  const size = Math.pow(2, 32 - len), net = Math.floor(base/size)*size;
  return v > net && v < net + size - 1;
}
const LABEL_RE = /^(\(\s*\d+\s*\)|\d+\)|\d+\.|[①-⑳]|[ㄱ-ㅎ]\.|[a-z]\.)\s+/i;
function parseLine(s){
  const m = LABEL_RE.exec(s);
  return m ? {label:m[1].replace(/\s/g,""), value:s.slice(m[0].length)} : {label:"", value:s};
}
function variants(val){
  const out = new Set();
  const add = s => { s = String(s).trim(); if(s) out.add(s); };
  add(val);
  String(val).split(/\s+또는\s+|\s+or\s+/i).forEach(part => {
    add(part);
    const m = /^(.*?)\s*\((.*)\)\s*$/.exec(part.trim());
    if(m){
      add(m[1]);
      const inner = m[2].trim().replace(/^또는\s*/,"");
      if(!/^대소문자/.test(inner)){ add(inner); inner.split(/\s*[,\/]\s*/).forEach(add); }
    }
  });
  return Array.from(out);
}
function parseBogi(q){
  const t = (q.extra || "") + "\n" + (q.after || "");
  const at = t.lastIndexOf("[보기]");
  const seg = at >= 0 ? t.slice(at + 4) : t;
  const re = /([㉠-㉧]|[ㄱ-ㅎ]\.)\s*/g, marks = [], map = {};
  let m;
  while((m = re.exec(seg))) marks.push({ch:m[1][0], start:m.index, end:re.lastIndex});
  marks.forEach((mk,i) => {
    const next = i + 1 < marks.length ? marks[i+1].start : seg.length;
    const txt = seg.slice(mk.end, next).split("\n")[0].trim();
    if(!(mk.ch in map)) map[mk.ch] = txt;
  });
  return map;
}
function optList(q, opts){
  const map = parseBogi(q);
  return opts.map(v => ({v:v, text: map[v] || ""}));
}
const FORMS = {};
function formOf(q){
  if(FORMS[q.id]) return FORMS[q.id];
  const sp = SPEC[q.id] || {};
  let f;
  if(sp.mode === "pick" || sp.mode === "order"){
    f = {mode:sp.mode, opts:optList(q, sp.opts), key:sp.key.slice(), hint:sp.hint};
  } else if(sp.mode === "each"){
    f = {mode:"each", multi:!!sp.multi, labels:sp.labels, opts:optList(q, sp.opts), key:sp.key};
  } else {
    f = {mode:"text", combos:sp.combos, setTokens:sp.setTokens};
    let fields;
    if(sp.fields){
      fields = sp.fields.map(x => Object.assign({}, x));
    } else {
      const lines = q.ans, parsed = lines.map(parseLine);
      if(lines.length === 1) fields = [{label:parsed[0].label, raw:parsed[0].value}];
      else if(parsed.every(p => p.label)) fields = parsed.map(p => ({label:p.label, raw:p.value}));
      else fields = [{label:"", raw:lines.join("\n"), multiline:true}];
    }
    fields.forEach((fd, i) => {
      if(!fd.cidr){
        const set = new Set();
        if(fd.raw != null) variants(fd.raw).forEach(v => set.add(v));
        ((sp.alt && sp.alt[i]) || []).forEach(a => set.add(a));
        fd.acc = Array.from(set);
      }
      fd.digits = !!sp.digits || (sp.digitsFields || []).indexOf(i) >= 0;
      fd.rows = (fd.multiline && !sp.digits && !sp.setTokens) ? Math.min(Math.max(q.ans.length, 2), 6) : 1;
    });
    f.fields = fields;
  }
  FORMS[q.id] = f;
  return f;
}
function tokensOf(s){
  return String(s).replace(/[{}\[\]]/g,"").split(",").map(x => x.trim().replace(/^['"]|['"]$/g,"")).filter(Boolean).sort();
}
function gradeQ(q, f, inp){
  if(f.mode === "pick"){
    const sel = (inp.sel || []).slice();
    if(!sel.length) return {empty:true};
    const ok = sel.length === f.key.length && f.key.every(k => sel.indexOf(k) >= 0);
    return {ok:ok};
  }
  if(f.mode === "order"){
    const sel = inp.sel || [];
    if(!sel.length) return {empty:true};
    return {ok: sel.length === f.key.length && f.key.every((k,i) => sel[i] === k)};
  }
  if(f.mode === "each"){
    const ea = inp.each || [];
    if(!f.key.some((k,i) => ea[i] && (f.multi ? ea[i].length : true))) return {empty:true};
    const per = f.key.map((k,i) => {
      const v = ea[i];
      if(f.multi){ const a = v || []; return a.length === k.length && k.every(x => a.indexOf(x) >= 0); }
      return v === k;
    });
    return {ok:per.every(Boolean), per:per};
  }
  const t = inp.t || [];
  if(!f.fields.some((fd,i) => String(t[i] || "").trim())) return {empty:true};
  if(f.combos){
    const vals = f.fields.map((fd,i) => normStr(t[i], q, fd));
    const ok = f.combos.some(c => c.every((x,i) => normStr(x, q, f.fields[i]) === vals[i]));
    return {ok:ok, per:f.fields.map(() => ok)};
  }
  if(f.setTokens){
    const a = tokensOf(t[0]), b = f.setTokens.slice().sort();
    const ok = a.length === b.length && a.every((x,i) => x === b[i]);
    return {ok:ok, per:[ok]};
  }
  const per = f.fields.map((fd, i) => {
    const val = String(t[i] || "");
    if(!val.trim()) return false;
    if(fd.cidr){ const ip = val.trim(); return inCidr(ip, fd.cidr) && (fd.not || []).indexOf(ip) < 0; }
    const nv = normStr(val, q, fd);
    return fd.acc.some(a => normStr(a, q, fd) === nv);
  });
  return {ok:per.every(Boolean), per:per};
}

function pickSet(){

  if(state.mode === "rounds") list = list.filter(q => state.rounds.has(rk(q)));
  else if(state.mode === "areas") list = list.filter(q => state.areas.has(q.area) && state.types.has(q.type));

  else if(state.mode === "review") list = list.filter(q => (state.review.wrong && progress[q.id] === "x") || (state.review.flag && flags[q.id]));
  return list;
}
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function targetCount(){
  const n = pickSet().length;
  return state.mode === "random" ? Math.min(state.count, n) : n;
}
function buildList(){
  let l = pickSet();
  const mixed = state.mode === "random" || ((state.mode === "areas" || state.mode === "review") && state.order === "shuffle");
  if(mixed) shuffle(l);
  if(state.mode === "random") l = l.slice(0, state.count);
  return l;
}

  } else if(f.mode === "pick"){
    const multi = f.key.length > 1;
    h += '<p class="pickhint">'+(multi ? "해당하는 것을 모두 골라요" : "알맞은 것을 하나 골라요")+'</p><div class="opts">'
      + f.opts.map(o => optHTML(o, (inp.sel || []).indexOf(o.v) >= 0, "pickToggle", 'data-v="'+esc(o.v)+'"')).join("") + '</div>';
  } else if(f.mode === "order"){
    h += '<p class="pickhint">'+(f.hint || (f.key.length+"개를 순서대로 눌러요. 다시 누르면 취소돼요"))+'</p><div class="opts">'
      + f.opts.map(o => { const k = (inp.sel || []).indexOf(o.v); return optHTML(o, k >= 0, "orderTap", 'data-v="'+esc(o.v)+'"', k >= 0 ? k+1 : 0); }).join("") + '</div>'
      + ((inp.sel || []).length ? '<div class="skiprow"><button class="link" data-act="orderClear">선택 모두 지우기</button></div>' : '');
  } else if(f.mode === "each"){
    h += '<p class="pickhint">'+(f.multi ? "칸마다 해당하는 것을 모두 골라요" : "칸마다 알맞은 것을 하나씩 골라요")+'</p>';
    f.labels.forEach((lab, i) => {
      const cur = inp.each[i];
      h += '<div class="eachrow"><span class="in-label">'+esc(lab)+'</span><div class="opts">'
        + f.opts.map(o => {
            const on = f.multi ? (cur || []).indexOf(o.v) >= 0 : cur === o.v;
            return optHTML(o, on, "eachSet", 'data-i="'+i+'" data-v="'+esc(o.v)+'"');
          }).join("") + '</div></div>';
    });
  }
  if(msg) h += '<p class="msg">'+esc(msg)+'</p>';
  h += '<div class="skiprow"><button class="link" data-act="next">이 문제 건너뛰기</button></div></div>';
  return h;
}
function mineHTML(q, f, inp, r){
  let rows = [];
  const mk = (lab, val, ok) => '<div class="mrow">'+(lab ? '<span class="mlab">'+esc(lab)+'</span>' : '')
    + (val ? '<span class="'+(ok === false ? "no" : "ok")+'">'+esc(val)+(ok === true ? " ✓" : "")+'</span>' : '<span class="empty">(비어 있음)</span>')+'</div>';
  if(f.mode === "text"){
    f.fields.forEach((fd, i) => rows.push(mk(fd.label, inp.t[i] || "", r.per ? r.per[i] : r.ok)));
  } else if(f.mode === "pick"){
    rows.push(mk("", (inp.sel || []).join(", "), r.ok));
  } else if(f.mode === "order"){
    rows.push(mk("", (inp.sel || []).join(" → "), r.ok));
  } else if(f.mode === "each"){
    f.labels.forEach((lab, i) => {
      const v = inp.each[i];
      rows.push(mk(lab, f.multi ? (v || []).join(", ") : (v || ""), r.per ? r.per[i] : r.ok));
    });
  }
  return '<div class="mine"><h3>내가 쓴 답</h3>' + rows.join("") + '</div>';
}
function renderSolve(){
  const s = state.session, q = s.list[s.i], total = s.list.length;
  const st = s.st[q.id], res = s.res[q.id], f = formOf(q), inp = getInp(q.id);
  const last = s.i === total - 1;
  const anim = s.justGraded === q.id;
  s.justGraded = null;

  let mark = "";
  if(res) mark = (res === "o" ? MARK_O : MARK_X).replace("MA", anim ? "anim" : "");

  let h = '<div class="topbar"><div class="topbar-row"><button class="quit" data-act="home">나가기</button>'
    + '<div class="pos">'+(s.i+1)+' / '+total+'</div>'
    + '<button class="flagbtn" data-act="toggleFlag" aria-pressed="'+(flags[q.id] ? "true" : "false")+'">'+ICON_STAR+'<span>'+(flags[q.id] ? "체크됨" : "체크")+'</span></button></div>'
    + '<div class="progress"><i style="width:'+((s.i+1)/total*100)+'%"></i></div></div>';

  h += '<section class="sheet">'
    + '<div class="sheet-head"><span>정보처리기사 실기 '+q.year+'년 '+q.round+'회</span>'
    + '<a href="'+esc(q.src)+'" target="_blank" rel="noopener noreferrer">원문 보기</a></div>'
    + '<div class="numrow"><div class="num">'+q.n+mark+'</div>'
    + '<span class="tag">'+esc(q.area)+'</span><span class="tag">'+esc(TYPE_NAME[q.type]||q.type)+'</span>'
    + (!res && progress[q.id] === "x" ? '<span class="tag red">지난번에 틀렸어요</span>' : '')
    + '</div>';

  h += '<p class="stem">'+esc(q.stem)+'</p>';
  if(q.extra) h += '<div class="extra">'+esc(q.extra)+'</div>';
  const codeHTML = q.code ? '<pre class="code"><code>'+esc(q.code)+'</code></pre>' : '';
  const figHTML = figs(imgNames(q,"q"));
  h += q.imgAfterCode ? codeHTML + figHTML : figHTML + codeHTML;
  if(q.after) h += '<div class="extra">'+esc(q.after)+'</div>';

  if(!st){
    h += renderInputs(q, f, inp, s.msg[q.id]);
  } else {
    const r = s.last[q.id];
    h += '<div class="answer">';
    if(st === "graded"){
      h += '<div class="banner '+(r.ok ? "ok" : "no")+'">'+(r.ok ? ICON_O : ICON_X)+'<span>'+(r.ok ? "정답이에요" : "틀렸어요")+'</span></div>';
      h += mineHTML(q, f, inp, r);
    }
    h += '<h3 class="ah">정답</h3>' + q.ans.map(a => '<div class="ans-line">'+esc(a)+'</div>').join("");
    if(q.note) h += '<p class="ans-note">'+esc(q.note)+'</p>';
    h += figs(imgNames(q,"a"));
    if(EXPL[q.id]) h += '<div class="explain"><h3>해설</h3><div class="body">'+fmtExpl(EXPL[q.id])+'</div></div>';
    h += '<p class="grade-label">'+(st === "graded" ? "자동 채점이 다르면 직접 바꿀 수 있어요" : "정답을 보고 스스로 채점해요")+'</p>'
      + '<div class="grade">'
      + '<button data-act="grade" data-v="o" aria-pressed="'+(res==="o")+'">'+ICON_O+'맞았어요</button>'
      + '<button data-act="grade" data-v="x" aria-pressed="'+(res==="x")+'">'+ICON_X+'틀렸어요</button>'
      + '</div>'
      + '<div class="skiprow"><button class="link" data-act="retry">이 문제 다시 풀기</button></div>'
      + '</div>';
  }
  h += '</section>';

  h += '<div class="bottombar">'
    + '<button class="btn" data-act="prev" '+(s.i===0?"disabled":"")+'>이전</button>'
    + (st
        ? '<button class="btn primary" data-act="next">'+(last?"결과 보기":"다음 문제")+'</button>'
        : '<button class="btn" data-act="reveal">정답 보기</button><button class="btn primary" data-act="check">채점하기</button>')
    + '</div>';

  $app.innerHTML = h;
  try{ window.scrollTo(0,0); }catch(e){}
  if(!st && f.mode === "text" && s.focusNext){
    const el = $app.querySelector("[data-inp]");
    if(el && window.matchMedia && window.matchMedia("(hover:hover)").matches){ try{ el.focus({preventScroll:true}); }catch(e){} }
  }
  s.focusNext = false;
}

/* ---- 화면: 결과 ---- */
function renderResult(){
  const s = state.session;
  const o = s.list.filter(q => s.res[q.id] === "o").length;
  const x = s.list.filter(q => s.res[q.id] === "x");
  const skipped = s.list.length - o - x.length;
  const pct = s.list.length ? Math.round(o / s.list.length * 100) : 0;

  let h = '<section class="result"><div class="score">'+o+'<small> / '+s.list.length+'</small></div>'
    + '<p>정답률 '+pct+'%'+(skipped ? ', 채점하지 않은 문제 '+skipped+'개' : '')+'</p>';
  if(x.length){
    h += '<h2>틀린 문제</h2><ul class="wrong-list">'
      + x.map(q => '<li><div>'+esc(q.label)+'</div><span>'+esc(q.area)+'</span></li>').join("")
      + '</ul>';
  }
  h += '<div class="result-actions">'
    + (x.length ? '<button class="btn primary" data-act="retryWrong">틀린 문제만 다시 풀기</button>' : '')
    + '<button class="btn '+(x.length?"":"primary")+'" data-act="home">처음으로</button></div></section>';
  $app.innerHTML = h;
  try{ window.scrollTo(0,0); }catch(e){}
}

/* ---- 화면: 이미지 점검 ---- */
function renderCheck(){
  const need = [];
  ALL.forEach(q => {
    imgNames(q,"q").forEach(n => need.push({q:q, n:n, kind:"문제"}));
    imgNames(q,"a").forEach(n => need.push({q:q, n:n, kind:"정답"}));
  });
  let h = '<section class="check"><h1>필요한 이미지 점검</h1>'
    + '<p class="sum" id="chk-sum">'+(need.length ? "확인하는 중이에요" : "이미지가 필요한 문제가 없어요.")+'</p>';
  if(need.length){
    h += '<table><thead><tr><th>문제</th><th>파일 이름</th><th>상태</th></tr></thead><tbody>'
      + need.map(r => '<tr><td>'+esc(r.q.label)+' ('+r.kind+')</td><td><code>img/'+r.n+'.png</code></td><td id="st-'+r.n+'">확인 중</td></tr>').join("")
      + '</tbody></table>';
  }
  h += '<div class="result-actions"><button class="btn primary" data-act="home">돌아가기</button></div></section>';
  $app.innerHTML = h;
  if(!need.length) return;
  let ok = 0, done = 0;
  need.forEach(r => probe(r.n).then(ext => {
    const el = document.getElementById("st-"+r.n);
    if(el){ el.innerHTML = ext ? '<span class="st-ok">있음</span>' : '<span class="st-no">없음</span>'; }
    if(ext) ok++;
    done++;
    const sum = document.getElementById("chk-sum");
    if(sum) sum.textContent = "필요한 이미지 "+need.length+"개 중 "+ok+"개가 있어요" + (done < need.length ? " (확인 중)" : "");
  }));
}

/* =====================================================================
   동작
   ===================================================================== */
function render(){
  if(state.screen === "home") renderHome();
  else if(state.screen === "solve") renderSolve();
  else if(state.screen === "result") renderResult();
  else if(state.screen === "check") renderCheck();
}
function newSession(list, at){
  state.session = {list:list, i:at || 0, inp:{}, st:{}, res:{}, last:{}, msg:{}, justGraded:null, focusNext:true};
  state.screen = "solve";
}
function toggle(set, k){ if(set.has(k)) set.delete(k); else set.add(k); }
function curQ(){ const s = state.session; return s.list[s.i]; }
function setResult(q, v){
  const s = state.session;
  s.res[q.id] = v; progress[q.id] = v; s.justGraded = q.id; saveProg();
}
function go(delta){
  const s = state.session;
  const n = s.i + delta;
  if(n < 0) return;
  if(n >= s.list.length){ state.screen = "result"; render(); return; }
  s.i = n; s.focusNext = true; render();
}

const actions = {
  setMode(d){ state.mode = d.v; if(d.v === "random") state.order = "shuffle"; else if(d.v === "rounds") state.order = "seq"; render(); },
  toggleRound(d){ toggle(state.rounds, d.k); render(); },
  allRounds(){ ROUNDS.forEach(r => state.rounds.add(rk(r))); render(); },
  noRounds(){ state.rounds.clear(); render(); },
  toggleArea(d){ toggle(state.areas, d.k); render(); },
  allAreas(){ areasPresent.forEach(a => state.areas.add(a)); render(); },
  noAreas(){ state.areas.clear(); render(); },
  toggleType(d){ toggle(state.types, d.k); render(); },
  toggleReview(d){ state.review[d.k] = !state.review[d.k]; render(); },
  setOrder(d){ state.order = d.v; render(); },
  setCount(d){ state.count = +d.v; render(); },
  start(){ const l = buildList(); if(!l.length) return; newSession(l); render(); },
  openAt(d){
    const l = pickSet(), i = l.findIndex(q => q.id === d.id);
    if(i < 0) return;
    newSession(l, i); render();
  },
  home(){ state.screen = "home"; state.session = null; render(); try{ window.scrollTo(0,0); }catch(e){} },
  toggleFlag(){
    const q = curQ();
    if(flags[q.id]) delete flags[q.id]; else flags[q.id] = true;
    saveFlags();
    const y = window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){}
  },
  pickToggle(d){
    const q = curQ(), f = formOf(q), inp = getInp(q.id);
    const multi = f.key.length > 1, a = inp.sel || (inp.sel = []), k = a.indexOf(d.v);
    if(multi){ if(k >= 0) a.splice(k,1); else a.push(d.v); }
    else inp.sel = k >= 0 ? [] : [d.v];
    const y = window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){}
  },
  orderTap(d){
    const q = curQ(), f = formOf(q), inp = getInp(q.id);
    const a = inp.sel || (inp.sel = []), k = a.indexOf(d.v);
    if(k >= 0) a.splice(k,1); else if(a.length < f.key.length) a.push(d.v);
    const y = window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){}
  },
  orderClear(){ getInp(curQ().id).sel = []; const y = window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){} },
  eachSet(d){
    const q = curQ(), f = formOf(q), inp = getInp(q.id), i = +d.i;
    if(f.multi){
      const a = inp.each[i] || (inp.each[i] = []), k = a.indexOf(d.v);
      if(k >= 0) a.splice(k,1); else a.push(d.v);
    } else inp.each[i] = inp.each[i] === d.v ? undefined : d.v;
    const y = window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){}
  },
  check(){
    const s = state.session, q = curQ(), f = formOf(q);
    const r = gradeQ(q, f, getInp(q.id));
    if(r.empty){ s.msg[q.id] = "답을 적거나 골라 주세요. 모르겠다면 '정답 보기'를 눌러요."; const y = window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){} return; }
    s.msg[q.id] = "";
    s.st[q.id] = "graded"; s.last[q.id] = r;
    setResult(q, r.ok ? "o" : "x");
    render();
  },
  reveal(){ const s = state.session, q = curQ(); s.st[q.id] = "shown"; s.last[q.id] = {}; render(); },
  grade(d){
    const q = curQ();
    setResult(q, d.v);
    const y = window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){}
  },
  retry(){
    const s = state.session, q = curQ();
    delete s.st[q.id]; delete s.last[q.id]; delete s.res[q.id]; delete s.msg[q.id];
    s.inp[q.id] = {t:[], sel:[], each:[]}; s.focusNext = true; render();
  },
  next(){ go(1); },
  prev(){ go(-1); },
  retryWrong(){
    const s = state.session;
    const l = s.list.filter(q => s.res[q.id] === "x");
    if(l.length){ newSession(l); render(); }
  },
  checkImages(){ state.screen = "check"; render(); try{ window.scrollTo(0,0); }catch(e){} },
  resetProgress(){
    if(confirm("지금까지의 맞음/틀림 기록과 체크 표시를 모두 지울까요?")){ progress = {}; flags = {}; saveProg(); saveFlags(); render(); }
  }
};

const $app = document.getElementById("app");
$app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if(fn) fn(el.dataset);
});
$app.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset && el.dataset.inp !== undefined && state.session){
    getInp(curQ().id).t[+el.dataset.i] = el.value;
  }
});
$app.addEventListener("keydown", e => {
  const el = e.target;
  if(el.dataset && el.dataset.inp !== undefined && e.key === "Enter"){
    if(el.tagName === "TEXTAREA" && !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    actions.check();
  }
});
document.addEventListener("keydown", e => {
  if(state.screen !== "solve" || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const s = state.session, q = curQ(), st = s.st[q.id];
  const onBtn = tag === "BUTTON" || tag === "A";
  if(e.key === "ArrowRight") actions.next();
  else if(e.key === "ArrowLeft") actions.prev();
  else if(e.key === "Enter" && !onBtn){ if(st) actions.next(); else actions.check(); e.preventDefault(); }
  else if(st && (e.key === "o" || e.key === "O")) actions.grade({v:"o"});
  else if(st && (e.key === "x" || e.key === "X")) actions.grade({v:"x"});
});

/* 테스트와 점검을 위해 일부를 밖에 노출 */
window.__jcs = {ALL:ALL, formOf:formOf, gradeQ:gradeQ, state:state, EXPL:EXPL, SPEC:SPEC};

render();
})();
</script>
</body>
</html>
